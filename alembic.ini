# alembic.ini — Alembic migration tool configuration.
# Lives in the project root alongside main.py.
#
# DATABASE URL is NOT stored here — it is read from the .env file via
# app.core.config.settings inside alembic/env.py.
# This keeps credentials out of version control.
#
# Usage:
#   alembic upgrade head          # apply all pending migrations
#   alembic downgrade -1          # roll back one migration
#   alembic revision --autogenerate -m "description"   # generate new migration
#   alembic history               # show migration log
#   alembic current               # show which revision the DB is on

[alembic]
# Path to the migrations folder, relative to this file.
script_location = alembic

# Naming convention for auto-generated revision files.
# Example output: 20240315_143022_add_user_role.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

# Timezone used in the file_template timestamps.
timezone = UTC

# sqlalchemy.url is intentionally left blank here.
# env.py overrides it with settings.DATABASE_URL at runtime so credentials
# never have to appear in this file (which is committed to version control).
sqlalchemy.url =

# Prepend sys.path entries (space-separated) so env.py can import the app.
# The empty string means "the project root", which is where alembic.ini lives.
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S